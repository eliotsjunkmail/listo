<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listy — Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="brand">
        <p class="brand-name">Listy</p>
        <h1 class="headline">What needs doing?</h1>
        <p class="subhead">Capture tasks, check them off, keep the day moving.</p>
      </header>

      <form class="composer" id="todo-form" autocomplete="off">
        <label class="sr-only" for="todo-input">New task</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="Add a task…"
          maxlength="200"
          required
        />
        <button type="submit" class="btn-add">Add</button>
      </form>

      <div class="toolbar" role="tablist" aria-label="Filter tasks">
        <button type="button" class="filter is-active" data-filter="all" role="tab" aria-selected="true">
          All
        </button>
        <button type="button" class="filter" data-filter="active" role="tab" aria-selected="false">
          Active
        </button>
        <button type="button" class="filter" data-filter="done" role="tab" aria-selected="false">
          Done
        </button>
      </div>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>

      <footer class="status-bar">
        <span id="count-label">0 tasks left</span>
        <button type="button" class="btn-clear" id="clear-done" hidden>
          Clear completed
        </button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
