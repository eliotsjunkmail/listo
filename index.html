<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Frogger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=99" />
  </head>
  <body class="is-vertical">
    <button type="button" class="synth-toggle" id="synth-toggle" aria-pressed="false">
      <span class="synth-dot" aria-hidden="true"></span>
      <span id="synth-label">Demo mode <span class="pill-value">OFF</span></span>
    </button>

    <div class="market" id="market" aria-live="polite">
      <span class="market-dot" aria-hidden="true"></span>
      <span class="market-label" id="market-label">Market <span class="pill-value">closed</span></span>
    </div>

    <button type="button" class="app-version" id="app-version" aria-label="Version 99. Tap to hard refresh">
      v99
    </button>

    <header class="hud" aria-live="polite">
      <div class="hud-top">
        <div class="scoreboard">
          <div class="score-panel">
            <span class="score-value" id="hud-score">$100,000</span>
          </div>
          <div class="score-panel score-change is-flat" id="hud-change">
            <span class="score-value" id="hud-pnl">+$0</span>
          </div>
        </div>
        <button type="button" class="gear" id="gear" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.22-1.14.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.16a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.49.41 1.04.72 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.22 1.14.53 1.63-.94l2.39.96c.24.1.51.01.64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
            />
          </svg>
        </button>
      </div>
      <div
        class="timer"
        id="timer"
        role="progressbar"
        aria-label="Time left"
        aria-valuemin="0"
        aria-valuemax="300"
        aria-valuenow="300"
      >
        <div class="timer-track">
          <div class="timer-bar" id="timer-bar"></div>
        </div>
        <span class="timer-label" id="timer-label">5:00</span>
        <button type="button" class="stop-round" id="stop-round" hidden>Stop</button>
      </div>
      <p class="hud-meta" id="hud-buys"></p>
    </header>

    <div class="toast" id="toast" hidden></div>

    <div class="world" id="world">
      <div class="bank bank-top" aria-hidden="true"></div>

      <div class="river" id="river">
        <div class="lane" data-lane="0">
          <div class="log" id="log-0" data-index="0">
            <div class="log-trail" aria-hidden="true"></div>
            <div class="log-wood">
              <span class="log-sym" id="sym-0">SNAP</span>
              <span class="log-last" id="last-0">—</span>
            </div>
          </div>
          <button type="button" class="level level-res" id="res-0" hidden>
            <span class="level-tip" hidden></span>
          </button>
          <button type="button" class="level level-sup" id="sup-0" hidden>
            <span class="level-tip" hidden></span>
          </button>
        </div>
        <div class="lane" data-lane="1">
          <div class="log" id="log-1" data-index="1">
            <div class="log-trail" aria-hidden="true"></div>
            <div class="log-wood">
              <span class="log-sym" id="sym-1">META</span>
              <span class="log-last" id="last-1">—</span>
            </div>
          </div>
          <button type="button" class="level level-res" id="res-1" hidden>
            <span class="level-tip" hidden></span>
          </button>
          <button type="button" class="level level-sup" id="sup-1" hidden>
            <span class="level-tip" hidden></span>
          </button>
        </div>
        <div class="lane" data-lane="2">
          <div class="log" id="log-2" data-index="2">
            <div class="log-trail" aria-hidden="true"></div>
            <div class="log-wood">
              <span class="log-sym" id="sym-2">GOOG</span>
              <span class="log-last" id="last-2">—</span>
            </div>
          </div>
          <button type="button" class="level level-res" id="res-2" hidden>
            <span class="level-tip" hidden></span>
          </button>
          <button type="button" class="level level-sup" id="sup-2" hidden>
            <span class="level-tip" hidden></span>
          </button>
        </div>
        <div class="lane" data-lane="3">
          <div class="log" id="log-3" data-index="3">
            <div class="log-trail" aria-hidden="true"></div>
            <div class="log-wood">
              <span class="log-sym" id="sym-3">NVDA</span>
              <span class="log-last" id="last-3">—</span>
            </div>
          </div>
          <button type="button" class="level level-res" id="res-3" hidden>
            <span class="level-tip" hidden></span>
          </button>
          <button type="button" class="level level-sup" id="sup-3" hidden>
            <span class="level-tip" hidden></span>
          </button>
        </div>
      </div>

      <div class="bank bank-bottom" aria-hidden="true"></div>
      <button
        type="button"
        class="frog"
        id="frog"
        data-lev="1"
        data-side="long"
        aria-label="Long 1x. Tap to flip long or short"
      >
        <span class="frog-lev" id="frog-lev" aria-hidden="true">1×</span>
      </button>
    </div>

    <div class="pad" id="pad" aria-label="Controls">
      <button type="button" class="pad-btn" data-dir="up" aria-label="Jump up">▲</button>
      <div class="pad-mid">
        <button type="button" class="pad-btn" data-dir="left" aria-label="Move left">◀</button>
        <button type="button" class="pad-btn" data-dir="down" aria-label="Jump down">▼</button>
        <button type="button" class="pad-btn" data-dir="right" aria-label="Move right">▶</button>
      </div>
    </div>

    <div class="demo-overlay" id="demo-overlay" hidden>
      <div class="demo-screen">
        <button type="button" class="demo-cta" id="demo-cta">Start game</button>
      </div>
    </div>

    <div class="scrim round-scrim" id="round-scrim" hidden>
      <form class="panel round-panel" id="round-panel" role="dialog" aria-modal="true" aria-labelledby="round-title">
        <div class="modal-head">
          <h2 id="round-title">Frogger</h2>
          <button type="button" class="sheet-close" id="round-close" aria-label="Close">
            ×
          </button>
        </div>
        <div class="round-body">
          <p class="round-copy" id="round-copy">Five minutes. Make it count.</p>
          <div class="round-score" id="round-score" hidden>
            <span class="round-score-label">Final score</span>
            <span class="round-score-value" id="round-score-value">$100,000</span>
          </div>
          <div class="leaderboard" id="leaderboard" hidden>
            <h3>Leaderboard</h3>
            <ol id="leaderboard-list"></ol>
          </div>
          <label id="player-name-field">
            Your name
            <input
              id="player-name"
              type="text"
              maxlength="24"
              spellcheck="false"
              autocomplete="nickname"
              placeholder="Enter your name"
            />
          </label>
          <p class="round-status" id="round-status" hidden></p>
        </div>
        <div class="round-footer">
          <button type="submit" class="done" id="round-play">Start</button>
        </div>
      </form>
    </div>

    <div class="scrim" id="scrim" hidden>
      <form class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 id="settings-title">Settings</h2>
        <label>
          Player name
          <input
            id="settings-player-name"
            type="text"
            maxlength="24"
            spellcheck="false"
            autocomplete="nickname"
          />
        </label>
        <label>
          Lane 1
          <input id="sym-a" type="text" maxlength="8" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          Lane 2
          <input id="sym-b" type="text" maxlength="8" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          Lane 3
          <input id="sym-c" type="text" maxlength="8" spellcheck="false" autocomplete="off" />
        </label>
        <label>
          Lane 4
          <input id="sym-d" type="text" maxlength="8" spellcheck="false" autocomplete="off" />
        </label>
        <label class="toggle-field">
          <span class="toggle-copy">
            <span class="toggle-title">Log motion</span>
            <span class="toggle-sub" id="orientation-label">Vertical — up / down</span>
          </span>
          <input
            id="orientation-toggle"
            class="switch-input"
            type="checkbox"
            role="switch"
            checked
            aria-label="Vertical log motion"
          />
        </label>
        <label class="pace-field">
          <span class="pace-field-head">
            <span>Demo pace</span>
            <span id="pace-value">4</span>
          </span>
          <input
            id="pace-slider"
            class="pace-slider"
            type="range"
            min="1"
            max="10"
            step="1"
            value="4"
            aria-label="Demo movement pace"
          />
        </label>
        <label class="check-field">
          <input id="sound-on" type="checkbox" checked />
          <span>Sound</span>
        </label>
        <button type="submit" class="done">Done</button>
      </form>
    </div>

    <script src="config.js?v=99"></script>
    <script src="app.js?v=99"></script>
  </body>
</html>
