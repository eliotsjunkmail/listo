<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Holdings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=7" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="sheet">
      <header class="top">
        <label class="sr-only" for="symbol">Stock symbol</label>
        <input
          id="symbol"
          class="brand-input"
          type="text"
          value="SNAP"
          maxlength="8"
          spellcheck="false"
          autocomplete="off"
          aria-label="Stock symbol"
        />
        <p class="company" id="company">Snap Inc.</p>
      </header>

      <section class="quote" aria-live="polite">
        <p class="price" id="value">—</p>
        <p class="change" id="change">Fetching quote…</p>
        <p class="asof" id="asof"></p>
      </section>

      <section class="progress-block">
        <div class="progress-meta">
          <span id="progress-label">$0</span>
          <span id="progress-pct">0%</span>
          <span id="progress-target">$2,000,000</span>
        </div>
        <div
          class="bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="2000000"
          aria-valuenow="0"
          id="bar"
        >
          <div class="bar-fill" id="bar-fill"></div>
        </div>
        <p class="remain" id="remain">Toward $2,000,000</p>
      </section>

      <form class="controls" id="settings">
        <label>
          Shares
          <input id="shares" type="number" min="0" step="1" value="130000" />
        </label>
        <label>
          Target ($)
          <input id="target" type="number" min="1" step="1" value="2000000" />
        </label>
      </form>

      <footer class="foot">
        <button type="button" id="refresh" class="refresh">Refresh</button>
        <p class="note" id="note">Delayed quote · Yahoo Finance</p>
      </footer>
    </main>

    <script src="app.js?v=7"></script>
  </body>
</html>
